[build]
builder = "nixpacks"

[build.nixpacks]
installCmd = "npm install"
buildCmd = "cd apps/api && npm run build"

[deploy]
# tsx (prod dependency) runs the TS source directly — @scorecard/shared is consumed as
# TypeScript source, which plain `node dist/` cannot require (Phase 1B runtime finding).
startCommand = "npm start -w apps/api"
healthcheckPath = "/health"
healthcheckTimeout = 10
