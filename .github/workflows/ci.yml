name: CI

on:
  push:
    branches: [master, codex/audit-reliability-checkpoints]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence_dev
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence -d cadence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cadence:cadence_dev@localhost:5432/cadence_test
      TEST_DATABASE_URL: postgresql://cadence:cadence_dev@localhost:5432/cadence_test
      AUTH_SECRET: ci-test-secret-not-for-production-use
      # Dummy values so the production-mode "fail loudly if SSO unconfigured"
      # check in src/lib/auth/index.ts doesn't block the build — CI never
      # actually signs anyone in.
      AUTH_MICROSOFT_ENTRA_ID_ID: ci-placeholder
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ci-placeholder
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/ci-placeholder/v2.0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Run database migrations
        run: pnpm db:migrate

      - run: pnpm test

      - name: Verify production build
        # NODE_ENV=production is scoped to just this step, not the whole job —
        # setting it job-wide broke `pnpm test` (Vite/Vitest's jsdom test
        # environment externalizes Node builtins like `crypto` as browser
        # stubs under NODE_ENV=production, so anything importing `crypto`,
        # e.g. sync-engine.ts's payloadHash, throws "createHash is not a
        # function"). This step still needs it for the real check: the
        # production-mode SSO fail-loudly guard in src/lib/auth/index.ts.
        run: pnpm build
        env:
          NODE_ENV: production
