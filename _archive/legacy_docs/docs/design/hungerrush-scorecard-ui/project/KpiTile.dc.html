<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hungerrush-design-system-019e0969-0408-74ae-a185-dfd70be87320/tokens/fonts.css">
</helmet>
<div style="background: {{ tile.cardBg }}; border: 1px solid {{ tile.cardBorder }}; border-radius: 14px; padding: 20px 22px 22px; min-height: 182px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(30,46,74,0.04), 0 6px 20px rgba(30,46,74,0.05); display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s;" style-hover="box-shadow: 0 2px 6px rgba(30,46,74,0.06), 0 14px 34px rgba(30,46,74,0.09); transform: translateY(-2px)">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
    <span style="font: 600 11px/1.5 Roboto, sans-serif; letter-spacing: .7px; text-transform: uppercase; color: #8A93A0; padding-top: 3px;">{{ tile.name }}</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 9px; border-radius: 999px; background: {{ tile.tint }}; color: {{ tile.textColor }}; font: 600 11px/1 Roboto, sans-serif; letter-spacing: .2px; white-space: nowrap; flex-shrink: 0;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{ tile.dotColor }};"></span>
      {{ tile.statusLabel }}
    </span>
  </div>

  <sc-if value="{{ tile.hasData }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: baseline; gap: 3px; margin-top: 15px;">
      <span style="font: 800 42px/1 'Nunito Sans', sans-serif; color: #1E2E4A; letter-spacing: -1px;">{{ tile.value }}</span>
      <span style="font: 700 18px/1 'Nunito Sans', sans-serif; color: #9AA2AE; letter-spacing: -0.2px;">{{ tile.unit }}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
      <svg viewBox="0 0 100 30" width="104" height="30" preserveAspectRatio="none" style="overflow: visible; flex-shrink: 0;">
        <polygon points="{{ tile.area }}" style="fill: {{ tile.fillFaint }}; stroke: none;"></polygon>
        <polyline points="{{ tile.line }}" style="fill: none; stroke: {{ tile.dotColor }}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"></polyline>
        <circle cx="{{ tile.lastX }}" cy="{{ tile.lastY }}" r="2.6" style="fill: {{ tile.dotColor }};"></circle>
      </svg>
      <span style="font: 500 11px/1 Roboto, sans-serif; color: #B3B8C0; letter-spacing: .3px; white-space: nowrap;">4 weeks</span>
    </div>
    <div style="margin-top: auto; padding-top: 15px;">
      <p style="margin: 0; font: 400 13.5px/1.55 Roboto, sans-serif; color: #4C566A;">{{ tile.prompt }}</p>
    </div>
  </sc-if>

  <sc-if value="{{ tile.noData }}">
    <div style="display: flex; align-items: baseline; margin-top: 15px;">
      <span style="font: 300 42px/1 'Nunito Sans', sans-serif; color: #C4C0B6; letter-spacing: -1px;">&mdash;</span>
    </div>
    <div style="margin-top: auto; padding-top: 15px;">
      <p style="margin: 0; font: 400 13.5px/1.55 Roboto, sans-serif; color: #9A948A;">{{ tile.prompt }}</p>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 200}, &quot;tile&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}}"></script>
</body>
</html>
